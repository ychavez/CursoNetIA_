name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '25 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.29.0
        with:
          languages: csharp
          build-mode: manual
      - name: Build
        run: dotnet build CursoNETIA.slnx --configuration Release
      - name: Analyze
        uses: github/codeql-action/analyze@v3.29.0
