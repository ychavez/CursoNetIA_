name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test-coverage:
    name: Build, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies and reporting tool
        run: |
          dotnet restore CursoNETIA.slnx
          dotnet tool restore
      - name: Build without warnings
        run: dotnet build CursoNETIA.slnx --configuration Release --no-restore --warnaserror
      - name: Verify coverage gate
        run: dotnet run --file tools/CoverageGate.cs -- --self-test
      - name: Unit, integration and architecture tests
        id: tests
        run: >-
          dotnet test CursoNETIA.slnx --configuration Release --no-build --no-restore
          --collect "XPlat Code Coverage" --settings coverage.runsettings
          --logger trx --results-directory artifacts/test-results
      - name: Merge coverage and generate reports
        id: coverage
        if: ${{ always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != 'cancelled' }}
        run: >-
          dotnet tool run reportgenerator
          "-reports:artifacts/test-results/**/coverage.cobertura.xml"
          "-targetdir:artifacts/coverage"
          "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"
          "-verbosity:Warning"
      - name: Publish coverage summary
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Require at least 80 percent line coverage
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        run: dotnet run --file tools/CoverageGate.cs -- artifacts/coverage/Cobertura.xml 80
      - name: Preserve test results and coverage
        if: ${{ always() && steps.tests.outcome != 'skipped' && steps.tests.outcome != 'cancelled' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-and-coverage
          path: |
            artifacts/test-results
            artifacts/coverage
          if-no-files-found: error
          retention-days: 14
