name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CursoNETIA.slnx

      - name: Build
        run: dotnet build CursoNETIA.slnx --configuration Release --no-restore

      - name: Run architecture tests
        run: >-
          dotnet test tests/AulaPedidos.ArchitectureTests/AulaPedidos.ArchitectureTests.csproj
          --configuration Release
          --no-build

      - name: Run infrastructure tests with coverage
        run: >-
          dotnet test tests/AulaPedidos.Infrastructure.Tests/AulaPedidos.Infrastructure.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "${{ github.workspace }}/TestResults"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Run API integration tests with coverage
        run: >-
          dotnet test tests/AulaPedidos.Api.IntegrationTests/AulaPedidos.Api.IntegrationTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "${{ github.workspace }}/TestResults"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Require coverage reports
        shell: bash
        run: |
          mapfile -t reports < <(find TestResults -type f -name 'coverage.cobertura.xml')
          if (( ${#reports[@]} != 2 )); then
            echo "Expected 2 coverage.cobertura.xml reports, but found ${#reports[@]}." >&2
            exit 1
          fi
          printf 'Found %d coverage report(s).\n' "${#reports[@]}"

      - name: Publish coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both
          thresholds: '80 80'
          fail_below_min: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14
